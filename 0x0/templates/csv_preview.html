<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV preview</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      box-sizing: border-box;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100dvh;
    }
    .toolbar {
      flex: 0 0 auto;
      padding: 0.75rem 1rem;
    }
    .toolbar p { margin: 0 0 0.5rem; }
    .toolbar input {
      box-sizing: border-box;
      width: 5.5rem;
    }
    .scrollbox {
      flex: 1;
      min-height: 0;
      overflow: auto;
      position: relative;
    }
    table {
      background: #fff;
      border-collapse: separate;
      border-spacing: 0;
      box-sizing: border-box;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #d1d5db;
      box-sizing: border-box;
      height: 28px;
      overflow: hidden;
      padding: 0 0.4rem;
      text-overflow: clip;
      white-space: nowrap;
    }
    th {
      background: #f3f4f6;
      font-weight: 600;
    }
    thead th {
      position: relative;
      z-index: 2;
      background: #f3f4f6;
    }
    th.num {
      position: relative;
      z-index: 2;
      background: #f3f4f6;
      width: 80px;
    }
    thead th.num {
      z-index: 3;
    }
    .num { width: 80px; }
    .cell { cursor: pointer; }
    dialog {
      max-height: 80dvh;
      overflow: auto;
      white-space: pre-wrap;
      width: min(90vw, 60ch);
    }
    dialog pre {
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <p>
      <a href="{{ download_url }}">Download</a>
      {% if rows > 0 %}
      <label>Row <input id="goto" type="number" min="1" max="{{ rows }}"></label>
      {% if cols > 0 %}
      <label>Column <input id="gotocol" type="text" autocomplete="off" spellcheck="false"></label>
      {% endif %}
      {% endif %}
    </p>
    {% if stopped %}
    <p>Couldn't read past row {{ rows }}.</p>
    {% elif rows == 0 %}
    <p>Empty file.</p>
    {% endif %}
  </div>
  {% if rows > 0 %}
  <div class="scrollbox">
    <div class="sizer">
      <div class="viewport">
        <table></table>
      </div>
    </div>
  </div>
  <dialog>
    <form method="dialog"><button>Close</button></form>
    <h2></h2>
    <pre></pre>
  </dialog>
  {% endif %}
  <script>
    const CFG = {{ {"rows": rows, "cols": cols, "dataUrl": data_url} | tojson }};
    const RH = 28, CW = 120, NW = 80, LH = 28, CAP = 10000000;
    const MIN_CW = 96, MAX_CW = 640, CELL_INSET = 16;
    if (CFG.rows > 0) {
      const scrollbox = document.querySelector(".scrollbox");
      const sizer = document.querySelector(".sizer");
      const viewport = document.querySelector(".viewport");
      const table = document.querySelector("table");
      const dialog = document.querySelector("dialog");
      const tiles = new Map();
      const inflight = new Map();
      const columnWidths = new Map();
      const columnOffsets = new Float64Array(CFG.cols + 1);
      const measure = document.createElement("canvas").getContext("2d");
      measure.font = getComputedStyle(scrollbox).font;
      let viewRows = 1, poolRows = 1, poolCols = 0;
      let spacerH = 0, spacerW = 0, vScaled = false, hScaled = false;
      let maxX = 0;
      let cellGen = 0;

      function updateColumnOffsets() {
        for (let c = 0; c < CFG.cols; c++) {
          columnOffsets[c + 1] = columnOffsets[c] + (columnWidths.get(c) || CW);
        }
      }

      function fitText(text, width) {
        if (measure.measureText(text).width <= width) return text;
        const chars = Array.from(text);
        let lo = 0, hi = chars.length - 1, best = "…";
        while (lo <= hi) {
          const keep = Math.floor((lo + hi) / 2);
          const left = Math.floor(keep / 2), right = keep - left;
          const candidate = chars.slice(0, left).join("") + "…" + (right ? chars.slice(-right).join("") : "");
          if (measure.measureText(candidate).width <= width) {
            best = candidate;
            lo = keep + 1;
          } else {
            hi = keep - 1;
          }
        }
        return best;
      }

      function colLetter(n) {
        let s = "";
        n += 1;
        while (n > 0) {
          n--;
          s = String.fromCharCode(65 + n % 26) + s;
          n = Math.floor(n / 26);
        }
        return s;
      }

      function colIndex(s) {
        s = String(s || "").trim().toUpperCase();
        if (/^\d+$/.test(s)) {
          const n = parseInt(s, 10);
          return Math.max(0, Math.min(CFG.cols - 1, n - 1));
        }
        if (/^[A-Z]+$/.test(s)) {
          let n = 0;
          for (let i = 0; i < s.length; i++) {
            n = n * 26 + (s.charCodeAt(i) - 64);
          }
          return Math.max(0, Math.min(CFG.cols - 1, n - 1));
        }
        return 0;
      }

      function layout(anchor = null, remainder = 0) {
        viewRows = Math.max(1, Math.min(CFG.rows, Math.floor((scrollbox.clientHeight - LH) / RH)));
        const extraH = CFG.rows > viewRows ? (CFG.rows - viewRows) * RH : 0;
        maxX = CFG.cols === 0 ? 0 : Math.max(0, NW + columnOffsets[CFG.cols] - scrollbox.clientWidth);
        spacerH = Math.min(scrollbox.clientHeight + extraH, CAP);
        spacerW = Math.min(scrollbox.clientWidth + maxX, CAP);
        vScaled = extraH > 0 && spacerH < scrollbox.clientHeight + extraH;
        hScaled = maxX > 0 && spacerW < scrollbox.clientWidth + maxX;
        sizer.style.height = spacerH + "px";
        sizer.style.width = spacerW + "px";
        viewport.style.position = "sticky";
        viewport.style.top = "0";
        viewport.style.left = "0";
        viewport.style.height = "0";
        viewport.style.width = "0";
        viewport.style.overflow = "visible";
        poolRows = Math.min(CFG.rows, viewRows + 2);
        poolCols = Math.min(CFG.cols, Math.max(1, Math.ceil((scrollbox.clientWidth - NW) / MIN_CW)) + 2);
        if (anchor !== null) scrollbox.scrollLeft = horizontalToScroll(columnOffsets[anchor] + remainder);
        table.replaceChildren();
        const head = table.createTHead();
        const hr = head.insertRow();
        hr.appendChild(document.createElement("th")).className = "num";
        for (let j = 0; j < poolCols; j++) {
          const th = document.createElement("th");
          th.className = "cell";
          hr.appendChild(th);
        }
        const body = table.createTBody();
        for (let i = 0; i < poolRows; i++) {
          const tr = body.insertRow();
          const th = document.createElement("th");
          th.className = "num";
          tr.appendChild(th);
          for (let j = 0; j < poolCols; j++) {
            const td = document.createElement("td");
            td.className = "cell";
            tr.appendChild(td);
          }
        }
        draw();
      }

      function firstRow() {
        if (CFG.rows <= viewRows) return 0;
        const maxScroll = spacerH - scrollbox.clientHeight;
        if (maxScroll <= 0) return 0;
        if (!vScaled)
          return Math.min(CFG.rows - viewRows, Math.floor(scrollbox.scrollTop / RH));
        return Math.min(CFG.rows - viewRows, Math.floor(scrollbox.scrollTop / maxScroll * (CFG.rows - viewRows)));
      }

      function firstCol() {
        if (CFG.cols === 0) return 0;
        const x = horizontalOffset();
        let lo = 0, hi = CFG.cols - 1;
        while (lo < hi) {
          const mid = Math.ceil((lo + hi) / 2);
          if (columnOffsets[mid] <= x) lo = mid;
          else hi = mid - 1;
        }
        return lo;
      }

      function horizontalOffset() {
        const maxScroll = spacerW - scrollbox.clientWidth;
        if (maxScroll <= 0) return 0;
        return hScaled ? scrollbox.scrollLeft / maxScroll * maxX : Math.min(scrollbox.scrollLeft, maxX);
      }

      function horizontalToScroll(x) {
        x = Math.max(0, Math.min(maxX, x));
        return hScaled && maxX > 0 ? Math.ceil(x / maxX * (spacerW - scrollbox.clientWidth)) : x;
      }

      function rowToScroll(fr) {
        if (CFG.rows <= viewRows) return 0;
        if (!vScaled) return fr * RH;
        const maxScroll = spacerH - scrollbox.clientHeight;
        if (maxScroll <= 0) return 0;
        return fr / (CFG.rows - viewRows) * maxScroll;
      }

      function colToScroll(fc) {
        return horizontalToScroll(columnOffsets[fc]);
      }

      // ponytail: each tile re-parses 200 full rows even when it only needs 50 columns. Cache parsed row blocks if wide sheets feel slow when scrolling sideways.
      function cellText(r, c) {
        if (c >= CFG.cols) return "";
        const rb = Math.floor(r / 200), cb = Math.floor(c / 50);
        const tile = tiles.get(rb + ":" + cb);
        if (!tile) return "";
        const row = tile[r - rb * 200];
        if (!row) return "";
        const text = row[c - cb * 50];
        return text == null ? "" : text;
      }

      function wantTile(rb, cb) {
        const key = rb + ":" + cb;
        if (tiles.has(key) || inflight.has(key)) {
          if (tiles.has(key)) {
            const val = tiles.get(key);
            tiles.delete(key);
            tiles.set(key, val);
          }
          return;
        }
        const p = fetch(CFG.dataUrl + "?rb=" + rb + "&cb=" + cb)
          .then((res) => res.json())
          .then((data) => {
            const rows = data.rows || [];
            const anchor = firstCol(), remainder = horizontalOffset() - columnOffsets[anchor];
            let resized = false;
            for (let j = 0; j < Math.min(50, CFG.cols - cb * 50); j++) {
              const c = cb * 50 + j;
              // Keep the first measured width so vertical scrolling doesn't shift the columns.
              if (columnWidths.has(c)) continue;
              let width = MIN_CW;
              for (const row of rows) width = Math.max(width, Math.ceil(measure.measureText(row[j] || "").width + CELL_INSET));
              columnWidths.set(c, Math.min(MAX_CW, width));
              resized = true;
            }
            tiles.set(key, rows.map(row => row.map((text, j) => fitText(text, columnWidths.get(cb * 50 + j) - CELL_INSET))));
            inflight.delete(key);
            while (tiles.size > 64) tiles.delete(tiles.keys().next().value);
            if (resized) {
              updateColumnOffsets();
              layout(anchor, remainder);
            } else draw();
          })
          .catch(() => inflight.delete(key));
        inflight.set(key, p);
      }

      function draw() {
        const fr = firstRow();
        const fc = firstCol();
        const remX = Math.max(0, horizontalOffset() - columnOffsets[fc]);
        const remY = !vScaled && CFG.rows > viewRows ? Math.max(0, scrollbox.scrollTop - fr * RH) : 0;

        table.style.transform = `translate(${-remX}px, ${-remY}px)`;
        table.style.width = (NW + columnOffsets[Math.min(CFG.cols, fc + poolCols)] - columnOffsets[fc]) + "px";

        const head = table.tHead.rows[0];
        head.cells[0].style.transform = `translate(${remX}px, ${remY}px)`;
        for (let j = 0; j < poolCols; j++) {
          const c = fc + j;
          const th = head.cells[j + 1];
          th.style.transform = `translateY(${remY}px)`;
          if (c >= CFG.cols) {
            th.textContent = "";
            th.style.display = "none";
          } else {
            th.style.display = "";
            th.style.width = (columnWidths.get(c) || CW) + "px";
            th.textContent = colLetter(c);
          }
        }
        const body = table.tBodies[0];
        for (let i = 0; i < poolRows; i++) {
          const r = fr + i;
          const tr = body.rows[i];
          if (r >= CFG.rows) {
            tr.style.display = "none";
            continue;
          }
          tr.style.display = "";
          tr.cells[0].style.transform = `translateX(${remX}px)`;
          tr.cells[0].textContent = String(r + 1);
          for (let j = 0; j < poolCols; j++) {
            const c = fc + j;
            const td = tr.cells[j + 1];
            if (c >= CFG.cols) {
              td.textContent = "";
              td.style.display = "none";
              td.onclick = null;
            } else {
              td.style.display = "";
              td.textContent = cellText(r, c);
              td.onclick = () => openCell(r, c);
            }
          }
        }
        const rb0 = Math.floor(fr / 200);
        const rb1 = Math.floor((Math.min(CFG.rows, fr + poolRows) - 1) / 200);
        const cb0 = poolCols === 0 ? 0 : Math.floor(fc / 50);
        const cb1 = poolCols === 0 ? -1 : Math.floor((Math.min(CFG.cols, fc + poolCols) - 1) / 50);
        for (let rb = rb0; rb <= rb1; rb++) {
          for (let cb = cb0; cb <= cb1; cb++) wantTile(rb, cb);
        }
      }

      function openCell(r, c) {
        const gen = ++cellGen;
        dialog.querySelector("h2").textContent = colLetter(c) + (r + 1);
        const pre = dialog.querySelector("pre");
        pre.textContent = "Loading…";
        dialog.showModal();
        fetch(CFG.dataUrl + "?r=" + r + "&c=" + c)
          .then((res) => res.json())
          .then((data) => { if (gen === cellGen) pre.textContent = data.text || ""; })
          .catch(() => { if (gen === cellGen) pre.textContent = ""; });
      }

      dialog.addEventListener("click", (e) => {
        if (e.target === dialog) dialog.close();
      });

      scrollbox.addEventListener("scroll", draw);
      window.addEventListener("resize", () => layout());

      scrollbox.addEventListener("wheel", (e) => {
        const vHit = vScaled && e.deltaY;
        const hHit = hScaled && e.deltaX;
        if (!vHit && !hHit) return;
        e.preventDefault();
        if (vHit) {
          const fr = Math.max(0, Math.min(CFG.rows - viewRows, firstRow() + Math.sign(e.deltaY)));
          scrollbox.scrollTop = rowToScroll(fr);
        } else if (e.deltaY) {
          scrollbox.scrollTop += e.deltaY;
        }
        if (hHit) {
          const fc = Math.max(0, Math.min(Math.max(CFG.cols - 1, 0), firstCol() + Math.sign(e.deltaX)));
          scrollbox.scrollLeft = colToScroll(fc);
        } else if (e.deltaX) {
          scrollbox.scrollLeft += e.deltaX;
        }
      }, { passive: false });

      const goto = document.getElementById("goto");
      goto.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const value = Math.min(CFG.rows, Math.max(1, Number(goto.value) || 1));
        goto.value = String(value);
        const fr = Math.min(value - 1, CFG.rows - viewRows);
        scrollbox.scrollTop = rowToScroll(fr);
        draw();
      });

      const gotocol = document.getElementById("gotocol");
      if (gotocol) {
        gotocol.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          e.preventDefault();
          if (CFG.cols === 0) return;
          const c = colIndex(gotocol.value);
          gotocol.value = colLetter(c);
          scrollbox.scrollLeft = colToScroll(c);
          draw();
        });
      }

      updateColumnOffsets();
      layout();
    }
  </script>
</body>
</html>
