services:
  app:
    build: ./0x0
    container_name: 0x0st
    restart: unless-stopped
    environment:
      DATABASE_URI: "${DATABASE_URI}"
      FLASK_APP: fhost
      MAX_SIZE: "${MAX_SIZE_MB:-512}"
      FHOST_LINK_SECRET: "${FHOST_LINK_SECRET}"
    volumes:
      - ./data/up:/app/up
    ports:
      - 8081:8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
    expose:
      - 5432
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cleanup:
    build: ./0x0
    profiles:
      - maintenance
    environment:
      DATABASE_URI: "${DATABASE_URI}"
      FLASK_APP: fhost
      MAX_SIZE: "${MAX_SIZE_MB:-512}"
      FHOST_LINK_SECRET: "${FHOST_LINK_SECRET}"
    command: ["python", "cleanup.py"]
    volumes:
      - ./data/up:/app/up
